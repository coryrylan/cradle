[settings]
lockfile = true

[tools]
bun = "1.4.0"
node = "26.8.1"

[tasks.clean]
run = [
  "git clean -dfX"
]

# Bare `mise lock` only refreshes platforms already present in mise.lock, so a
# newly added tool records no URLs at all and CI's `mise install --locked`
# fails on linux-x64. Always lock through this task.
[tasks.lock]
run = [
  "mise lock -p linux-x64,linux-arm64,macos-arm64"
]

[tasks.install]
run = [
  "mise install",
  "mise exec -- bun install --frozen-lockfile",
]

[tasks.setup]
run = [
  "mise run clean",
  "mise run install",
  "bun run ci",
]
