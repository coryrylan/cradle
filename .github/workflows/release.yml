name: Release
on:
  push:
    branches:
      - main

# Queue, never cancel — a second push racing an in-flight npm publish must wait
concurrency: release

jobs:
  release:
    name: Release
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      # npm publish --provenance mints its OIDC attestation token from the job
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release resolves the previous release from tags — shallow clones see none
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      # setup-node's registry-url equivalent — npm expands NODE_AUTH_TOKEN at publish time
      - run: echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc
      - run: bun run ci
      - name: Release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        run: WIREIT_PARALLEL=1 WIREIT_LOGGER=metrics bun run release
