name: Build
on: pull_request

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: google/wireit@setup-github-actions-caching/v2
      - run: bun install --frozen-lockfile
      - run: bun run ci
